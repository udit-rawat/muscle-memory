# Safety policy: what automation may do, enforced below both the discovery agent and replay.
# Every UI action and every network request the browser makes is checked against it.
version: 1

network:
  # Origins the browser may contact at all. "{base_url}" is bound at invocation to the exact origin of the
  # tenant's base URL (scheme, host and port), so a run can reach its own application and nothing else:
  # not other tenants, not other local services, and never the operator console (always denied).
  allow_origins:
    - "{base_url}"
  # Paths that are never reachable by automation, on any allowed origin.
  deny_paths:
    - "^/__control/"   # the mock bank's test-harness control plane
    - "^/logout"       # ending the operator's session is not a capability

actions:
  allowed: [navigate, click, fill, select, extract]

risk:
  # Strictest level first. Judged on a control's accessible name (what the operator reads on it).
  irreversible:
    # Controls whose activation commits something (matched against the accessible name).
    control_names: "(?i)\\b(confirm|post|transfer|delete|close account|approve|disburse|submit payment)\\b"
    # Requests that commit, whatever triggered them: blocked at the network layer unless an
    # irreversible step is explicitly authorised at that moment (defence in depth).
    requests:
      - { method: POST, path: "_confirm\\.jsp$" }
  mutating:
    # Controls that change application state but are not final (a form submit that creates a pending
    # request, a save). No approval needed, but once dispatched they are never repeated by a retry or restart.
    control_names: "(?i)\\b(save|update|submit|continue|apply|create|modify)\\b"
